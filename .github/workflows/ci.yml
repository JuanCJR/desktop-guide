name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test & build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  package:
    name: Package Windows installer
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build 64-bit NSIS installer (unsigned)
        run: pnpm package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Instalador aparte para Windows 10/11 de 32 bits (Electron 43, ver
      # electron-builder.ia32.yml). Misma app; solo cambia la versión de Electron.
      - name: Build 32-bit NSIS installer (unsigned)
        run: pnpm package:win32
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Sube cada instalador por separado y con un nombre que dice para qué
      # Windows es (nombres definidos en `artifactName` de cada configuración).
      - uses: actions/upload-artifact@v7
        with:
          name: instalador-windows-64-bits
          path: |
            release/*/Instalar-*-64bits-*.exe
            !release/*/*__uninstaller.exe
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: instalador-windows-32-bits
          path: |
            release/*-32bits/Instalar-*-32bits-*.exe
            !release/*/*__uninstaller.exe
          if-no-files-found: error
          retention-days: 7
