name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test & build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  package:
    name: Package Windows installer
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build NSIS installer (unsigned)
        run: pnpm package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Sube solo el instalador (Instalar-Manual-Induccion-IUPSM-<versión>.exe,
      # nombre definido en `artifactName` de electron-builder.yml).
      - uses: actions/upload-artifact@v7
        with:
          name: manual-induccion-iupsm-windows
          path: |
            release/*/Instalar-*.exe
            !release/*/*__uninstaller.exe
          if-no-files-found: error
          retention-days: 7
