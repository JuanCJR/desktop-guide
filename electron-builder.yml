# yaml-language-server: $schema=https://raw.githubusercontent.com/electron-userland/electron-builder/master/packages/app-builder-lib/scheme.json
appId: com.desktopguide.app
productName: Manual de Inducción IUPSM
# Nombre del archivo .exe del programa, sin tildes ni espacios para evitar
# problemas con rutas en Windows.
executableName: ManualInduccionIUPSM
copyright: Copyright © ${author}

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**/*
  - package.json
  - '!**/*.{map,ts,tsx}'

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  # Ícono del ejecutable y del instalador: build/icon.ico (sello del PSM, de
  # 16 a 256 px). electron-builder lo toma solo desde `buildResources`.
  icon: build/icon.ico
  # Code signing: set CSC_LINK / CSC_KEY_PASSWORD (or Azure Trusted Signing) in CI.
  # signtoolOptions: {}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # Nombre visible del acceso directo y en "Agregar o quitar programas".
  shortcutName: Manual de Inducción IUPSM
  uninstallDisplayName: Manual de Inducción IUPSM
  # El instalador y el desinstalador también llevan el sello del PSM.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Nombre del archivo del instalador que se entrega (sin tildes).
  artifactName: Instalar-Manual-Induccion-IUPSM-${version}.${ext}

publish: null
