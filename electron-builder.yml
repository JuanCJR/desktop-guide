# yaml-language-server: $schema=https://raw.githubusercontent.com/electron-userland/electron-builder/master/packages/app-builder-lib/scheme.json
appId: com.desktopguide.app
productName: Desktop Guide
copyright: Copyright © ${author}

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**/*
  - package.json
  - '!**/*.{map,ts,tsx}'

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  # Ícono del ejecutable y del instalador: build/icon.ico (sello del PSM, de
  # 16 a 256 px). electron-builder lo toma solo desde `buildResources`.
  icon: build/icon.ico
  # Code signing: set CSC_LINK / CSC_KEY_PASSWORD (or Azure Trusted Signing) in CI.
  # signtoolOptions: {}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # Nombre visible del acceso directo y en "Agregar o quitar programas".
  shortcutName: Manual de Inducción IUPSM
  uninstallDisplayName: Manual de Inducción IUPSM
  artifactName: ${name}-${version}-setup-${arch}.${ext}

publish: null
